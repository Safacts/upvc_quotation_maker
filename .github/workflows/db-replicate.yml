name: Replicate prod → staging DB

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to overwrite staging with prod data"
        required: true
        default: "YES"

jobs:
  replicate:
    runs-on: ubuntu-latest
    env:
      DBP: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROD: "postgresql://postgres:${DBP}@db.gumpmnbjdtzajhysnnaz.supabase.co:5432/postgres?sslmode=require"
      STAG: "postgresql://postgres:${DBP}@db.effxrwrbsjduvhmorvrq.supabase.co:5432/postgres?sslmode=require"
    steps:
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Back up staging first (safety net) + upload artifact
        run: pg_dump "$STAG" --schema=public --no-owner --no-privileges -Fc -f staging_before.dump
      - name: Upload staging backup
        uses: actions/upload-artifact@v4
        with:
          name: staging-backup-before-replicate
          path: staging_before.dump
          retention-days: 30

      - name: Dump prod public schema (schema + data)
        run: pg_dump "$PROD" --schema=public --no-owner --no-privileges -Fc -f prod.dump

      - name: Restore prod into staging
        run: pg_restore -d "$STAG" --schema=public --clean --if-exists --no-owner --disable-triggers prod.dump

      - name: Verify row counts on staging
        run: |
          for t in $(psql "$STAG" -t -c "select table_name from information_schema.tables where table_schema='public' order by table_name"); do
            echo "$t: $(psql "$STAG" -t -c "select count(*) from public.\"$t\"")"
          done
