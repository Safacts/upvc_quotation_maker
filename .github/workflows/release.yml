name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      clients:
        description: 'Comma-separated client IDs to build'
        required: true
        default: 'venkateshwara'

jobs:
  build:
    strategy:
      matrix:
        client: ${{ fromJson(format('["{0}"]', replace(github.event.inputs.clients || 'venkateshwara', ',', '","'))) }}
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      
      - run: flutter pub get
      
      - name: Build APK for ${{ matrix.client }}
        run: flutter build apk --release --dart-define=CLIENT_ID=${{ matrix.client }} --obfuscate --split-debug-info=debug/${{ matrix.client }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-${{ matrix.client }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ matrix.client }}-${{ github.run_number }}
          name: Release ${{ matrix.client }} v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
