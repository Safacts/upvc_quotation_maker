name: Build White-Labeled Client APK (Pro Mode)

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID (e.g. venkateshwara)'
        required: true
        type: string
      app_name:
        description: 'Custom App Title (e.g. Venkateshwara UPVC Quote)'
        required: true
        type: string
      version_name:
        description: 'Version Name for this build (e.g. 1.0.1). Defaults to 1.0.0.'
        required: false
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code (integer) for this build. Defaults to 1.'
        required: false
        default: '1'
        type: string
  repository_dispatch:
    types: [build-client-apk]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Extract Inputs
        id: vars
        env:
          CLIENT_ID_RAW: ${{ github.event.inputs.client_id || github.event.client_payload.client_id }}
          APP_NAME_RAW: ${{ github.event.inputs.app_name || github.event.client_payload.app_name }}
          VERSION_NAME_RAW: ${{ github.event.inputs.version_name || github.event.client_payload.version_name }}
          VERSION_CODE_RAW: ${{ github.event.inputs.version_code || github.event.client_payload.version_code }}
        run: |
          CLIENT_ID="$CLIENT_ID_RAW"
          APP_NAME="$APP_NAME_RAW"
          VERSION_NAME="$VERSION_NAME_RAW"
          VERSION_CODE="$VERSION_CODE_RAW"
          # Sanitize client_id: only alphanum, space, _ and - (2-80 chars)
          if ! printf '%s' "$CLIENT_ID" | grep -Eq '^[a-zA-Z0-9 _-]{2,80}$'; then
            echo "::error::Invalid client_id format"
            exit 1
          fi
          # Sanitize: allow only safe chars for app_name, fallback to client_id if suspicious
          if ! printf '%s' "$APP_NAME" | grep -Eq '^[a-zA-Z0-9 _-]+$'; then
            echo "::warning::app_name contains unsafe characters, sanitizing"
            APP_NAME=$(printf '%s' "$APP_NAME" | tr -cd 'a-zA-Z0-9 _-' | cut -c1-60)
            if [ -z "$APP_NAME" ]; then APP_NAME="${CLIENT_ID} UPVC Quote"; fi
          fi
          # Validate version_name semver and version_code numeric
          if [ -n "$VERSION_NAME" ] && ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version_name: must be semver like 1.0.0"
            exit 1
          fi
          if [ -n "$VERSION_CODE" ] && ! printf '%s' "$VERSION_CODE" | grep -Eq '^[0-9]{1,6}$'; then
            echo "::error::Invalid version_code: must be 1-6 digit integer"
            exit 1
          fi
          echo "client_id=${CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME:-1.0.0}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE:-1}" >> $GITHUB_OUTPUT

      - name: Patch Android App Label
        run: |
          ESCAPED_NAME=$(printf '%s' "${{ steps.vars.outputs.app_name }}" | sed -e 's/[&/\]/\\&/g')
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${ESCAPED_NAME}\"|g" android/app/src/main/AndroidManifest.xml

      - name: Create dummy .env
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Client Launcher Icons
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLIENT_ID: ${{ steps.vars.outputs.client_id }}
        run: |
          set -e
          mkdir -p /tmp/icon
          SRC="public/logo.png"
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            ENCODED_ID=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$CLIENT_ID")
            LOGO_URL=$(curl -sS "${SUPABASE_URL}/rest/v1/clients?id=eq.${ENCODED_ID}&select=config" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);process.stdout.write((r&&r[0]&&r[0].config&&r[0].config.logoUrl)||'')}catch(e){process.stdout.write('')}})")
            if [ -n "${LOGO_URL}" ]; then
              if ! printf '%s' "$LOGO_URL" | grep -Eq '^https://[a-z0-9-]+\.supabase\.co/storage/v1/object/public/assets/'; then
                echo "LOGO_URL not allowlisted (must be Supabase assets bucket), skipping icon fetch"
                LOGO_URL=""
              fi
            fi
            if [ -n "${LOGO_URL}" ] && curl -sSL --max-time 30 -o /tmp/icon/src "${LOGO_URL}" && file /tmp/icon/src | grep -qi "image"; then
              SRC="/tmp/icon/src"
            fi
          fi
          cp "$SRC" assets/icon_source.png
          echo "Icon source: $SRC -> assets/icon_source.png"
          dart run flutter_launcher_icons

      - name: Configure permanent release signing
        # Rehydrate the shared keystore (single permanent key, same signature on
        # every build) from GH secrets. Without this, gradle falls back to the
        # runner's ephemeral DEBUG keystore -> every build has a DIFFERENT
        # signature -> Android refuses install-over-existing ("package conflict").
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vitharn-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=vitharn-release.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "Permanent signing configured (keystore + key.properties written)."

      - name: Build Android Release APK
        # --target-platform android-arm64: build arm64-only APK.
        # The full 3-ABI APK is ~91MB which exceeds Supabase's 50MB object limit
        # (Free plan) and fails the storage upload with HTTP 413.
        # --build-name/--build-number: bake the version supplied by the trigger
        # (portal dispatches version_name/version_code; defaults 1.0.0/1) into
        # the APK so the in-app updater can compare against the installed one.
        # --dart-define=CLIENT_ID: WITHOUT this every APK falls back to
        # 'venkateshwara' (ClientLoader.getClientId) -> wrong logo/branding/
        # tenant in-app for every other client. Bakes the client identity in.
        run: flutter build apk --release --target-platform android-arm64 --dart-define=CLIENT_ID="${{ steps.vars.outputs.client_id }}" --build-name="${{ steps.vars.outputs.version_name }}" --build-number="${{ steps.vars.outputs.version_code }}"

      - name: Upload APK to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Supabase secrets not configured — skipping storage upload."
            exit 0
          fi
          SLUG=$(echo "${{ steps.vars.outputs.client_id }}" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')
          echo "slug=${SLUG}" >> $GITHUB_ENV
          HTTP_CODE=$(curl -sS -f -X PUT \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "x-upsert: true" \
            --data-binary "@build/app/outputs/flutter-apk/app-release.apk" \
            -w "%{http_code}" -o /tmp/upload_response.txt \
            "${SUPABASE_URL}/storage/v1/object/app-releases/${SLUG}/upvc-quote.apk")
          echo "Upload HTTP status: ${HTTP_CODE}"
          cat /tmp/upload_response.txt
          echo
          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "::error::APK upload failed (HTTP ${HTTP_CODE}) — aborting."
            exit 1
          fi
          echo "Uploaded app-releases/${SLUG}/upvc-quote.apk"

      - name: Publish Download URL to Client Config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLIENT_ID: ${{ steps.vars.outputs.client_id }}
          VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          VERSION_CODE: ${{ steps.vars.outputs.version_code }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Supabase secrets not configured — skipping config publish."
            exit 0
          fi
          node -e '
            const cid = process.env.CLIENT_ID;
            const slug = cid.toLowerCase().replace(/ /g, "-");
            const url = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
            const dl = `${url}/storage/v1/object/public/app-releases/${slug}/upvc-quote.apk`;
            const versionName = process.env.VERSION_NAME || "1.0.0";
            const versionCode = Number(process.env.VERSION_CODE) || 1;
            const headers = { apikey: key, Authorization: `Bearer ${key}` };
            (async () => {
              const r = await fetch(`${url}/rest/v1/clients?id=eq.${encodeURIComponent(cid)}&select=config`, { headers });
              if (!r.ok) throw new Error("GET clients failed: " + await r.text());
              const rows = await r.json();
              if (!rows || !rows.length) throw new Error("client not found: " + cid);
              const config = { ...(rows[0].config || {}) };
              config.appDownloadUrl = dl;
              config.appVersionName = versionName;
              config.appVersionCode = versionCode;
              config.lastBuildVersionName = versionName;
              config.lastBuildVersionCode = versionCode;
              config.lastBuildCompletedAt = new Date().toISOString();
              const p = await fetch(`${url}/rest/v1/clients?id=eq.${encodeURIComponent(cid)}`, {
                method: "PATCH",
                headers: { ...headers, "Content-Type": "application/json", Prefer: "return=minimal" },
                body: JSON.stringify({ config })
              });
              if (!p.ok) throw new Error("PATCH clients failed: " + await p.text());
              console.log("Published appDownloadUrl = " + dl);
              console.log("Published appVersionName = " + versionName + ", appVersionCode = " + versionCode);
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.client_id }}-upvc-quote
          path: build/app/outputs/flutter-apk/app-release.apk
