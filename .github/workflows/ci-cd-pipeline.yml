name: CI/CD Pipeline

on:
  push:
    branches:
      - development-v1
      - deployment-v1
      - main
  pull_request:
    branches:
      - development-v1
      - deployment-v1
      - main

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID_PRODUCTION: safacts-projects
  VERCEL_TEAM_ID_PRODUCTION: team_mncs1Ldt5EkzBL6mvQTJMAaF
  VERCEL_PROJECT_ID_PRODUCTION: upvc_quotation_maker
  VERCEL_ORG_ID_STAGING: team_6RAErY2LmBVNuVTByAXyXlqt
  VERCEL_TEAM_ID_STAGING: team_6RAErY2LmBVNuVTByAXyXlqt
  VERCEL_PROJECT_ID_STAGING: upvc_quotation_maker

jobs:
  # ============================================================
  # TEST & BUILD - Runs on all branches (branch-aware env)
  # ============================================================
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Check Flutter source (full lib)
        run: |
          flutter pub get
          # Full analyzer pass on lib/ - only errors block, warnings/infos reported
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Hydration guard check (no client-side code in SSR without window guard)
        run: |
          echo "Checking for hydration hazards..."
          VIOLATIONS=0
          # Check for useState/useEffect without window guard in components that render in SSR
          grep -r "useState\|useEffect" --include="*.tsx" app/ | grep -v "typeof window" | grep -v "// hydration-ok" | grep -v "test" | head -20 || true
          # Check for Script components without onError handler
          grep -r "<Script" --include="*.tsx" app/ | grep -v "onError" | grep -v "// script-error-ok" | head -10 || true
          # Fail if we find obvious violations (adjust threshold as needed)
          # For now just warn - can make this strict later

      - name: Verify deployment identity inputs
        if: github.event_name == 'push'
        env:
          DEPLOYMENT_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'jqjxhhgfwdzckijnnede' || 'vvkopgfumlideeslgbmk' }}
          EXPECTED_VERCEL_TEAM: ${{ github.ref == 'refs/heads/main' && env.VERCEL_ORG_ID_PRODUCTION || env.VERCEL_ORG_ID_STAGING }}
          EXPECTED_VERCEL_TEAM_ID: ${{ github.ref == 'refs/heads/main' && env.VERCEL_TEAM_ID_PRODUCTION || env.VERCEL_TEAM_ID_STAGING }}
          EXPECTED_VERCEL_PROJECT: ${{ github.ref == 'refs/heads/main' && env.VERCEL_PROJECT_ID_PRODUCTION || env.VERCEL_PROJECT_ID_STAGING }}
          SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          VERCEL_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN_PRODUCTION || secrets.VERCEL_TOKEN_STAGING }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-deployment-target.mjs

      - name: Run tests
        run: npx vitest run

      - name: Build Next.js (branch-aware env)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Use staging secrets for development-v1/deployment-v1, production secrets for main
          SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npm run build

  qa-gate:
    name: Required QA gate
    needs: test-and-build
    uses: ./.github/workflows/qa-gate.yml


  # ============================================================
  # DEPLOY TO STAGING - AUTOMATIC on deployment-v1 push
  # Fixed domain: vitharn-upvc-staging.vercel.app
  # ============================================================
  deploy-staging:
    name: Deploy to Staging (vitharn-upvc-staging.vercel.app)
    needs: [test-and-build, qa-gate]
    if: github.ref == 'refs/heads/deployment-v1'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Flutter web build
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify staging deployment identity
        env:
          DEPLOYMENT_ENV: staging
          EXPECTED_SUPABASE_PROJECT_REF: vvkopgfumlideeslgbmk
          EXPECTED_VERCEL_TEAM: ${{ env.VERCEL_ORG_ID_STAGING }}
          EXPECTED_VERCEL_TEAM_ID: ${{ env.VERCEL_TEAM_ID_STAGING }}
          EXPECTED_VERCEL_PROJECT: ${{ env.VERCEL_PROJECT_ID_STAGING }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_STAGING }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-deployment-target.mjs

      - name: Build Flutter web bundle for staging
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$STAGING_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$STAGING_SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_SIGNIN_ENABLED=false
          rm -rf public/app
          mkdir -p public/app
          cp -R build/web/. public/app/

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_STAGING }}
        run: |
          vercel link --yes --scope=${{ env.VERCEL_ORG_ID_STAGING }}

      - name: Set runtime env on staging Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_STAGING }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Writing runtime env vars into staging Vercel project (preview target)..."
          echo "These are what the serverless functions read at runtime (build-step env is NOT enough)."
          for pair in \
            "SUPABASE_URL:$STAGING_SUPABASE_URL" \
            "SUPABASE_ANON_KEY:$STAGING_SUPABASE_ANON_KEY" \
            "SUPABASE_SERVICE_ROLE_KEY:$STAGING_SUPABASE_SERVICE_ROLE_KEY" \
            "SUPABASE_KEY:$STAGING_SUPABASE_SERVICE_ROLE_KEY" \
            "NEXT_PUBLIC_SUPABASE_URL:$STAGING_SUPABASE_URL" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY:$STAGING_SUPABASE_ANON_KEY" \
            "JWT_SECRET:$JWT_SECRET"; do
            name="${pair%%:*}"; val="${pair#*:}"
            echo "len($name)=${#val}"
            # --value and --yes avoid the interactive CLI prompt, which can
            # silently fall back to Production when run without a TTY.
            # Preview is the target used by the staging deployment.
            # NEXT_PUBLIC_* must be --type config (exposed to browser); others are secret.
            if [[ "$name" == NEXT_PUBLIC_* ]]; then
              env_type="config"
            else
              env_type="secret"
            fi
            vercel env add "$name" preview,production \
              --value "$val" --force --yes --type "$env_type" \
              --scope=${{ env.VERCEL_ORG_ID_STAGING }} --token=$VERCEL_TOKEN
          done
          echo "Env vars configured."

      - name: Auto-deploy to Staging (vitarn.dev Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_STAGING }}
        run: |
          echo "=== AUTO-DEPLOYING TO STAGING ==="
          echo "Target: vitharn-upvc-staging.vercel.app"
          echo "Branch: ${{ github.ref }}"
          echo ""
          set +e
          # Deploy and capture JSON output (contains the deployment url)
          DEPLOY_JSON=$(vercel --token=$VERCEL_TOKEN \
            --scope=${{ env.VERCEL_ORG_ID_STAGING }} \
            --yes --json 2>&1)
          DEPLOY_RC=$?
          set -e
          echo "VERCEL EXIT CODE: $DEPLOY_RC"
          echo "$DEPLOY_JSON"
          DEPLOY_URL=$(echo "$DEPLOY_JSON" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | head -1)
          echo "Preview URL: $DEPLOY_URL"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to capture deployment URL from vercel output (rc=$DEPLOY_RC)"
            exit 1
          fi
          # The fixed staging URL is part of the test contract; alias failure must fail CI.
          vercel alias "$DEPLOY_URL" vitharn-upvc-staging.vercel.app --token=$VERCEL_TOKEN --scope=${{ env.VERCEL_ORG_ID_STAGING }}
          echo "✅ Aliased to: https://vitharn-upvc-staging.vercel.app"

  # ============================================================
  # STAGING SMOKE TEST - Verify external deps & critical paths
  # Routes aligned with scripts/smoke-test-staging.ps1
  # ============================================================
  staging-smoke:
    name: Staging smoke test
    needs: deploy-staging
    if: github.ref == 'refs/heads/deployment-v1'
    uses: ./.github/workflows/staging-smoke.yml
    with:
      base_url: https://vitharn-upvc-staging.vercel.app

  # ============================================================
  # PRODUCTION VERIFICATION - Vercel Git integration deploys main once
  # Production promotion remains gated by Aadi's explicit approval.
  # ============================================================
  verify-production:
    name: Verify Production (app.vitharn.com)
    needs: [test-and-build, qa-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel Git deployment
        run: sleep 30
      - name: Verify production routes
        run: |
          for route in "/" "/upvc" "/login" "/api/keepalive"; do
            code=$(curl -L -s -o /dev/null -w "%{http_code}" "https://app.vitharn.com$route" --max-time 30)
            if [ "$code" != "200" ] && [ "$code" != "302" ] && [ "$code" != "307" ]; then
              echo "::error::Production route $route returned $code"
              exit 1
            fi
            echo "Production route $route: $code"
          done
