name: CI/CD Pipeline

on:
  push:
    branches:
      - development-v1
      - deployment-v1
      - main
  pull_request:
    branches:
      - development-v1
      - deployment-v1
      - main

  # Manual trigger for explicit deployments (CURRENT MODE - with approval)
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - staging
          - production

  # AUTOMATIC DEPLOYMENT (PAUSED - activate by removing 'if: false' below)
  # push:
  #   branches:
  #     - deployment-v1    # -> auto-deploy staging
  #     - main             # -> auto-deploy production (with environment protection)

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID_PRODUCTION: vitarndev-8132s-projects
  VERCEL_PROJECT_ID_PRODUCTION: upvc_quotation_maker
  VERCEL_ORG_ID_STAGING: vitarn-dev-8132s-projects
  VERCEL_PROJECT_ID_STAGING: upvc_quotation_maker

jobs:
  # ============================================================
  # TEST & BUILD - Runs on all branches
  # ============================================================
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Next.js
        run: npm run build

  # ============================================================
  # DEPLOY TO STAGING - MANUAL TRIGGER ONLY (current mode)
  # Deploys to fixed domain: vitharn-upvc-staging.vercel.app
  # ============================================================
  deploy-staging:
    name: Deploy to Staging (vitharn-upvc-staging.vercel.app)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Staging (vitarn.dev Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_STAGING }}
        run: |
          echo "=== DEPLOYING TO STAGING ==="
          echo "Target: vitharn-upvc-staging.vercel.app"
          echo "Branch: ${{ github.ref }}"
          echo ""
          # Deploy to preview with fixed alias
          DEPLOY_URL=$(vercel --token=$VERCEL_TOKEN \
            --scope=vitarn-dev-8132s-projects \
            --prod=false \
            --yes 2>&1 | grep -E '^https://' | tail -1)
          echo "Preview URL: $DEPLOY_URL"
          # Alias to fixed staging domain
          if [ -n "$DEPLOY_URL" ]; then
            vercel alias $DEPLOY_URL vitharn-upvc-staging.vercel.app --token=$VERCEL_TOKEN --scope=vitarn-dev-8132s-projects
            echo "✅ Aliased to: https://vitharn-upvc-staging.vercel.app"
          fi

