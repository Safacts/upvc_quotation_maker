name: QA adversarial gate

on:
  pull_request:
  push:
    branches: [deployment-v1, main]

permissions:
  contents: read

jobs:
  security-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/security-release-gate.mjs --range origin/main
      - run: npm run test:load
