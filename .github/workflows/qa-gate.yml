name: QA adversarial gate

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.mjs --range origin/main
      - run: npx vitest run tests/adversarial-tenant-rate-limit.test.ts
