name: Staging smoke gate
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel Preview URL to verify
        required: true
        type: string
  deployment_status:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only staging probe
        env:
          UPTIME_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.target_url }}
        run: node scripts/uptime-check.mjs
