name: Staging smoke gate
on:
  workflow_call:
    inputs:
      base_url:
        description: Vercel Preview URL to verify
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve probe target
        env:
          RAW_URL: ${{ inputs.base_url }}
        run: |
          test -n "$RAW_URL"
          echo "UPTIME_BASE_URL=$RAW_URL" >> "$GITHUB_ENV"
          # Staging may sit behind Vercel Authentication; 302 is healthy.
          echo "UPTIME_ROUTES=/|200;302,/api/keepalive|200;302,/robots.txt|200;302,/sitemap.xml|200;302" >> "$GITHUB_ENV"
      - name: Read-only staging probe
        run: node scripts/uptime-check.mjs
