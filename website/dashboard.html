<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Venkateshwara UPVC Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-dark: #0f172a;
      --bg-light: #f8fafc;
      --card-bg: white;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
    }
    
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-container img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    
    .logo-text {
      font-size: 18px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
      transition: transform 0.2s;
    }
    
    .btn-logout:hover {
      transform: translateY(-1px);
    }
    
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 24px;
    }
    
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid #e2e8f0;
    }
    
    .table-container {
      overflow-x: auto;
      margin-top: 20px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    
    th {
      padding: 16px;
      border-bottom: 2px solid #e2e8f0;
      font-weight: 600;
      color: #64748b;
    }
    
    td {
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    tr:hover {
      background: #f8fafc;
    }
    
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 0;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(99, 102, 241, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="logo-container">
      <img src="https://effxrwrbsjduvhmorvrq.supabase.co/storage/v1/object/public/assets/logo.png" onerror="this.src='https://placehold.co/100'" alt="Venkateshwara UPVC">
      <span class="logo-text">Venkateshwara UPVC</span>
    </div>
    <button class="btn-logout" onclick="handleLogout()">Logout</button>
  </div>

  <div class="container">
    <h1>Quotation Database Logs</h1>
    
    <div class="card">
      <div id="loader" class="loading-container">
        <div class="spinner"></div>
      </div>
      
      <div class="table-container" id="tableWrapper" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>Quotation No</th>
              <th>Customer Name</th>
              <th>Date</th>
              <th>Subtotal</th>
              <th>Transport</th>
              <th>IGST (18%)</th>
              <th>Grand Total</th>
            </tr>
          </thead>
          <tbody id="quotationRows">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Verify portal session
    if (localStorage.getItem('portal_session') !== 'active') {
      window.location.href = 'login.html';
    }

    const SUPABASE_URL = 'https://effxrwrbsjduvhmorvrq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GmfOXLriCvXdppszTkF6Mg_FuLXt6PN';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadQuotations() {
      try {
        const { data: quotes, error: qErr } = await supabaseClient
          .from('quotations')
          .select('*')
          .order('created_at', { ascending: false });

        if (qErr) throw qErr;

        const { data: mItems, error: mErr } = await supabaseClient.from('measured_items').select('*');
        if (mErr) throw mErr;

        const { data: umItems, error: umErr } = await supabaseClient.from('unmeasured_items').select('*');
        if (umErr) throw umErr;

        // Group items
        const mItemsMap = {};
        mItems.forEach(item => {
          const qId = item.quotation_id;
          if (!mItemsMap[qId]) mItemsMap[qId] = [];
          mItemsMap[qId].push(item);
        });

        const umItemsMap = {};
        umItems.forEach(item => {
          const qId = item.quotation_id;
          if (!umItemsMap[qId]) umItemsMap[qId] = [];
          umItemsMap[qId].push(item);
        });

        const tbody = document.getElementById('quotationRows');
        tbody.innerHTML = '';

        quotes.forEach(q => {
          const qMItems = mItemsMap[q.id] || [];
          const qUmItems = umItemsMap[q.id] || [];

          // Compute subtotal
          let totalMeasured = 0;
          qMItems.forEach(item => {
            const w = Number(item.width || 0);
            const h = Number(item.height || 0);
            const u = Number(item.units || 1);
            const r = Number(item.rate || 0);
            const sft = (w / 304.8) * (h / 304.8);
            totalMeasured += (sft * u * r);
          });

          let totalUnmeasured = 0;
          qUmItems.forEach(item => {
            const u = Number(item.units || 1);
            const r = Number(item.rate || 0);
            totalUnmeasured += (u * r);
          });

          const subtotal = totalMeasured + totalUnmeasured;
          const transport = Number(q.transport_cost || 0);
          const igst = (subtotal + transport) * 0.18;
          const grandTotal = subtotal + transport + igst;

          const dateStr = q.date ? new Date(q.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${q.quote_no || '-'}</strong></td>
            <td>${q.customer_name || '-'}</td>
            <td>${dateStr}</td>
            <td>₹${subtotal.toFixed(2)}</td>
            <td>₹${transport.toFixed(2)}</td>
            <td>₹${igst.toFixed(2)}</td>
            <td><strong>₹${grandTotal.toFixed(2)}</strong></td>
          `;
          tbody.appendChild(row);
        });

        document.getElementById('loader').style.display = 'none';
        document.getElementById('tableWrapper').style.display = 'block';

      } catch (err) {
        console.error('Error fetching data:', err);
        alert('Failed to load quotation database records.');
      }
    }

    function handleLogout() {
      localStorage.removeItem('portal_session');
      window.location.href = 'login.html';
    }

    window.onload = loadQuotations;
  </script>
</body>
</html>
