<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Venkateshwara UPVC Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-dark: #0f172a;
      --bg-dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.5);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 50% 50%, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(226, 232, 240, 0.8);
      text-align: center;
    }
    
    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 50%;
      margin: 0 auto 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
      flex-shrink: 0;
    }
    
    h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
    }
    
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    
    label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    input:focus {
      border-color: #6366f1;
    }
    
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: left;
      display: none;
    }
    
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--primary-gradient);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.25);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
    }
    
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .forgot-link {
      display: block;
      margin-top: 16px;
      font-size: 14px;
      color: #6366f1;
      text-decoration: none;
      font-weight: 600;
    }
    
    .forgot-link:hover {
      text-decoration: underline;
    }
    
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    
    .modal-content h3 {
      margin-bottom: 12px;
      font-size: 20px;
    }
    
    .modal-content p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    .modal-actions button {
      flex: 1;
    }
    
    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
      box-shadow: none;
    }
    
    .btn-cancel:hover {
      background: #e2e8f0;
      box-shadow: none;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      display: none;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }
      .login-container {
        padding: 30px 20px;
        border-radius: 20px;
      }
      h2 {
        font-size: 24px;
      }
      .logo {
        width: 60px;
        height: 60px;
        margin-bottom: 15px;
      }
      input {
        padding: 12px 15px;
        font-size: 16px; /* Prevents iOS/Android zoom on focus */
      }
      button {
        padding: 12px;
        font-size: 15px;
      }
      .modal-content {
        padding: 25px 20px;
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img class="logo" src="https://effxrwrbsjduvhmorvrq.supabase.co/storage/v1/object/public/assets/logo.png" onerror="this.src='https://placehold.co/100'" alt="Venkateshwara UPVC">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to the Quotation Maker Portal</p>
    
    <div class="input-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="jvenkateshupvc@gmail.com">
    </div>
    
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <div id="errorBox" class="error-msg"></div>
    
    <button onclick="handleLogin()" id="loginBtn">
      <span class="spinner" id="loginSpinner"></span>
      <span id="loginText">Login</span>
    </button>
    <a href="#" class="forgot-link" onclick="triggerForgotPassword()">Forgot Password?</a>
  </div>

  <!-- OTP Modal -->
  <div class="modal" id="otpModal">
    <div class="modal-content">
      <h3>Enter OTP</h3>
      <p>A verification code has been dispatched to your email address. Enter it below to set a new password.</p>
      <div class="input-group">
        <label for="otpInput">OTP Code</label>
        <input type="number" id="otpInput" placeholder="123456">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('otpModal')">Cancel</button>
        <button onclick="verifyOtp()">Verify</button>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal" id="resetModal">
    <div class="modal-content">
      <h3>Set New Password</h3>
      <p>Enter your new password below (minimum 6 characters).</p>
      <div class="input-group">
        <label for="newPassInput">New Password</label>
        <input type="password" id="newPassInput" placeholder="••••••••">
      </div>
      <div class="modal-actions">
        <button onclick="saveNewPassword()" id="resetBtn">
          <span class="spinner" id="resetSpinner"></span>
          <span>Save Password</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = 'jvenkateshupvc@gmail.com';
    const SUPERUSER_EMAIL = 'kongaaadisheshu@gmail.com';
    const SUPABASE_URL = 'https://effxrwrbsjduvhmorvrq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GmfOXLriCvXdppszTkF6Mg_FuLXt6PN';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let generatedOtp = '';
    let forgotPasswordTargetEmail = '';

    // Async SHA-256 Hashing helper using Web Crypto API
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const loginBtn = document.getElementById('loginBtn');
      const loginSpinner = document.getElementById('loginSpinner');
      const loginText = document.getElementById('loginText');

      errorBox.style.display = 'none';

      if (email !== ADMIN_EMAIL && email !== SUPERUSER_EMAIL) {
        errorBox.innerText = 'Login restricted strictly to authorized admins.';
        errorBox.style.display = 'block';
        return;
      }

      // Show loader
      loginBtn.disabled = true;
      loginSpinner.style.display = 'block';
      loginText.style.display = 'none';

      try {
        const { data: admin, error } = await supabaseClient
          .from('admins')
          .select('password_hash')
          .eq('email', email)
          .maybeSingle();

        if (error || !admin) {
          throw new Error('Database request failed or user not found');
        }

        const inputHash = await sha256(password);
        if (admin.password_hash === inputHash) {
          localStorage.setItem('portal_session', 'active');
          localStorage.setItem('portal_email', email);
          window.location.href = 'dashboard.html';
        } else {
          errorBox.innerText = 'Invalid email or password.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.innerText = 'Unable to connect to the login portal. Please check your network connection and try again.';
        errorBox.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginSpinner.style.display = 'none';
        loginText.style.display = 'block';
      }
    }

    async function triggerForgotPassword() {
      const email = document.getElementById('email').value.trim();
      const errorBox = document.getElementById('errorBox');

      if (email !== ADMIN_EMAIL && email !== SUPERUSER_EMAIL) {
        errorBox.innerText = 'Please input a correct admin email to request OTP.';
        errorBox.style.display = 'block';
        return;
      }

      forgotPasswordTargetEmail = email;
      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

      // Show temporary loading indicator
      errorBox.style.color = '#6366f1';
      errorBox.innerText = 'Sending OTP code to your registered email...';
      errorBox.style.display = 'block';

      let success = false;
      const htmlBody = `
        <div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 30px; text-align: center; border: 1px solid #e2e8f0; border-radius: 12px; background-color: #ffffff;">
          <h2 style="color: #1E3A5F;">Password Reset Request</h2>
          <p style="color: #475569; font-size: 16px;">We received a request to reset your password for the Venkateshwara UPVC Portal.</p>
          <div style="background-color: #f1f5f9; padding: 20px; border-radius: 8px; margin: 25px 0; font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #1E3A5F;">
            ${generatedOtp}
          </div>
          <p style="color: #64748b; font-size: 14px;">Enter this code in the portal to reset your password. If you didn't request this, you can safely ignore this email.</p>
        </div>
      `;

      // Path 1: Direct insert into sent_emails table (which stores the record)
      try {
        const { error } = await supabaseClient
          .from('sent_emails')
          .insert({
            recipient: email,
            subject: 'Your Password Reset OTP',
            body: htmlBody
          });
        if (!error) {
          success = true;
        }
      } catch (dbErr) {
        console.warn('Database logging bypass:', dbErr);
      }

      // Path 2: Vercel Serverless Function Proxy (Bypasses browser adblock blockages)
      try {
        const response = await fetch('/api/send_otp', {
          method: 'POST',
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            otp: generatedOtp
          })
        });
        if (response.ok) {
          success = true;
        }
      } catch (netErr) {
        console.warn('Vercel relay mailing failed:', netErr);
      }

      if (success) {
        errorBox.style.display = 'none';
        document.getElementById('otpInput').value = '';
        // Open verification modal
        document.getElementById('otpModal').style.display = 'flex';
      } else {
        errorBox.style.color = '#ef4444';
        errorBox.innerText = 'Unable to send OTP. Please check your network connection and try again.';
        errorBox.style.display = 'block';
      }
    }

    function verifyOtp() {
      const inputOtp = document.getElementById('otpInput').value.trim();
      if (inputOtp === generatedOtp) {
        closeModal('otpModal');
        document.getElementById('resetModal').style.display = 'flex';
      } else {
        alert('Invalid OTP code.');
      }
    }

    async function saveNewPassword() {
      const newPass = document.getElementById('newPassInput').value;
      const resetBtn = document.getElementById('resetBtn');
      const resetSpinner = document.getElementById('resetSpinner');

      if (newPass.length < 6) {
        alert('Password must be at least 6 characters.');
        return;
      }

      resetBtn.disabled = true;
      resetSpinner.style.display = 'block';

      try {
        const newHash = await sha256(newPass);
        const { error } = await supabaseClient
          .from('admins')
          .update({ password_hash: newHash })
          .eq('email', forgotPasswordTargetEmail);

        if (error) throw error;

        alert('Password updated successfully in database!');
        closeModal('resetModal');
      } catch (err) {
        alert('Unable to save password. Please check your connection and try again.');
      } finally {
        resetBtn.disabled = false;
        resetSpinner.style.display = 'none';
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
